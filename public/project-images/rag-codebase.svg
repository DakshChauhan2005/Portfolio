      <rect x="996" y="350" rx="9" width="452" height="18" opacity=".6"/>
      <rect x="996" y="388" rx="9" width="360" height="18" opacity=".6"/>
      <rect x="996" y="426" rx="9" width="418" height="18" opacity=".38"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">
      <rect x="996" y="486" rx="14" width="290" height="48" fill="#facc15" opacity=".14" stroke="#facc15" stroke-width="1.5"/>
      <text x="1020" y="517" fill="#ffe082">src/index.js:42</text>
      <rect x="996" y="550" rx="14" width="320" height="48" fill="#facc15" opacity=".14" stroke="#facc15" stroke-width="1.5"/>
      <text x="1020" y="581" fill="#ffe082">lib/parser.js:118</text>
    </g>
    <rect x="996" y="622" rx="9" width="210" height="18" fill="#5eead4" opacity=".4"/>
  </g>

  <!-- query magnifier -->
  <g stroke="#e6f5ee" stroke-width="9" fill="none" opacity=".75">
    <circle cx="1360" cy="740" r="50"/><path d="M1396 776 L1444 824" stroke-linecap="round"/>
  </g>

  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
