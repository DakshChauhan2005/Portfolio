      <rect x="140" y="276" rx="7" width="110" height="14" fill="#facc15" opacity=".55"/>
    </g>
    <g>
      <rect x="110" y="362" rx="18" width="310" height="176" fill="url(#panel)" stroke="url(#edge)" stroke-width="2"/>
      <rect x="110" y="362" rx="18" width="310" height="44" fill="#5eead4" opacity=".1"/>
      <circle cx="140" cy="384" r="6" fill="#5eead4" opacity=".8"/>
      <rect x="158" y="377" rx="6" width="150" height="13" fill="#bff6e8" opacity=".55"/>
      <rect x="140" y="434" rx="7" width="110" height="14" fill="#c792ea" opacity=".9"/>
      <rect x="260" y="434" rx="7" width="90" height="14" fill="#8ff0da" opacity=".8"/>
      <rect x="140" y="466" rx="7" width="210" height="14" fill="#e6f5ee" opacity=".38"/>
      <rect x="140" y="498" rx="7" width="150" height="14" fill="#e6f5ee" opacity=".24"/>
    </g>
    <g>
      <rect x="110" y="584" rx="18" width="310" height="176" fill="url(#panel)" stroke="url(#edge)" stroke-width="2"/>
      <rect x="110" y="584" rx="18" width="310" height="44" fill="#5eead4" opacity=".1"/>
      <circle cx="140" cy="606" r="6" fill="#5eead4" opacity=".8"/>
      <rect x="158" y="599" rx="6" width="104" height="13" fill="#bff6e8" opacity=".55"/>
      <rect x="140" y="656" rx="7" width="90" height="14" fill="#c792ea" opacity=".9"/>
      <rect x="240" y="656" rx="7" width="110" height="14" fill="#8ff0da" opacity=".8"/>
      <rect x="140" y="688" rx="7" width="170" height="14" fill="#e6f5ee" opacity=".38"/>
      <rect x="140" y="720" rx="7" width="120" height="14" fill="#facc15" opacity=".45"/>
    </g>
  </g>

  <!-- retrieval beams -->
  <g fill="none" stroke="url(#beam)" stroke-width="4" stroke-linecap="round">
    <path d="M430 228 C 560 228, 600 380, 706 442"/>
    <path d="M430 450 C 560 450, 620 450, 706 450"/>
    <path d="M430 672 C 560 672, 600 520, 706 458"/>
  </g>
  <g fill="#a7ffe8">
    <circle cx="576" cy="268" r="5" opacity=".9"/><circle cx="640" cy="352" r="4" opacity=".65"/>
    <circle cx="560" cy="450" r="5" opacity=".9"/><circle cx="648" cy="450" r="4" opacity=".65"/>
    <circle cx="576" cy="632" r="5" opacity=".9"/><circle cx="640" cy="548" r="4" opacity=".65"/>
  </g>

  <!-- vector index orb -->
  <g>
    <circle cx="782" cy="450" r="104" fill="none" stroke="#facc15" stroke-width="1.5" opacity=".28"/>
    <circle cx="782" cy="450" r="132" fill="none" stroke="#facc15" stroke-width="1.5" opacity=".14" stroke-dasharray="6 14"/>
    <circle cx="782" cy="450" r="76" fill="#06201b" stroke="#facc15" stroke-width="3" filter="url(#bloom)" opacity=".95"/>
    <g stroke="#facc15" stroke-width="1.6" opacity=".5" fill="none">
      <path d="M752 422 L782 450 L812 422 M752 478 L782 450 L812 478 M752 422 L752 478 M812 422 L812 478"/>
    </g>
    <g fill="url(#orb)">
