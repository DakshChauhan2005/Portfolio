<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Repository files retrieved through a vector index into a cited answer">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03130f"/><stop offset=".5" stop-color="#0a2b26"/><stop offset="1" stop-color="#13544a"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".62" cy=".48" r=".45">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".32"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".1" cy=".9" r=".5">
      <stop offset="0" stop-color="#facc15" stop-opacity=".18"/><stop offset="1" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".78">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2822" stop-opacity=".97"/><stop offset="1" stop-color="#061a16" stop-opacity=".97"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff0da" stop-opacity=".65"/><stop offset="1" stop-color="#5eead4" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".1"/><stop offset="1" stop-color="#5eead4" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#fff3c4"/><stop offset=".45" stop-color="#facc15"/><stop offset="1" stop-color="#b7791f"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#7ff0d8" stroke-width="1" opacity=".07"/>
    </pattern>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#00120e" flood-opacity=".65"/>
    </filter>
    <filter id="bloom" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glowA)"/>
  <rect width="1600" height="900" fill="url(#glowB)"/>

  <!-- source files -->
  <g filter="url(#drop)">
    <g>
      <rect x="110" y="140" rx="18" width="310" height="176" fill="url(#panel)" stroke="url(#edge)" stroke-width="2"/>
      <rect x="110" y="140" rx="18" width="310" height="44" fill="#5eead4" opacity=".1"/>
      <circle cx="140" cy="162" r="6" fill="#5eead4" opacity=".8"/>
