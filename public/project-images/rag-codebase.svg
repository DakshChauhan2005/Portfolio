      <circle cx="812" cy="478" r="10"/><circle cx="782" cy="450" r="12"/>
    </g>
  </g>
  <path d="M862 450 L946 450" stroke="url(#beam)" stroke-width="4" stroke-linecap="round"/>

  <!-- answer panel -->
  <g filter="url(#drop)">
    <rect x="952" y="212" rx="26" width="540" height="476" fill="url(#panel)" stroke="url(#edge)" stroke-width="2"/>
    <rect x="952" y="212" rx="26" width="540" height="60" fill="#5eead4" opacity=".1"/>
    <circle cx="990" cy="242" r="8" fill="#5eead4"/>
    <rect x="1012" y="234" rx="7" width="150" height="16" fill="#bff6e8" opacity=".55"/>
    <g fill="#e6f5ee">
