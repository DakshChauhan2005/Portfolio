<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Neighbourhood map with verified provider pins and a booking card">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160820"/><stop offset=".5" stop-color="#2e1038"/><stop offset="1" stop-color="#6d2160"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".25" cy=".28" r=".5">
      <stop offset="0" stop-color="#ff8ad2" stop-opacity=".3"/><stop offset="1" stop-color="#ff8ad2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".8" cy=".8" r=".55">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".3"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".78">
      <stop offset=".52" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2"/><stop offset="1" stop-color="#ffffff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0f33" stop-opacity=".98"/><stop offset="1" stop-color="#16081d" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3e4" stop-opacity=".6"/><stop offset="1" stop-color="#ff8ad2" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="pinA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#f5b73d"/>
    </linearGradient>
    <linearGradient id="pinB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc0e6"/><stop offset="1" stop-color="#f062b8"/>
    </linearGradient>
    <linearGradient id="pinC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9f0ff"/><stop offset="1" stop-color="#5cc8f5"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8ad2"/><stop offset="1" stop-color="#b06bff"/>
    </linearGradient>
    <radialGradient id="avatar" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffd0ec"/><stop offset="1" stop-color="#c561a4"/>
    </radialGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#0a0210" flood-opacity=".7"/>
    </filter>
    <filter id="pinShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#12041a" flood-opacity=".7"/>
    </filter>
    <filter id="bloom" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#glowA)"/>
  <rect width="1600" height="900" fill="url(#glowB)"/>

  <!-- city blocks -->
  <g fill="#ffffff" opacity=".085">
    <rect x="40" y="290" width="230" height="220" rx="14"/>
    <rect x="360" y="60" width="330" height="150" rx="14"/>
    <rect x="360" y="600" width="330" height="240" rx="14"/>
    <rect x="820" y="60" width="300" height="150" rx="14"/>
    <rect x="1230" y="60" width="330" height="150" rx="14"/>
    <rect x="40" y="600" width="230" height="240" rx="14"/>
  </g>

  <!-- roads -->
  <g>
    <g stroke="#f0d9ff" stroke-width="40" stroke-linecap="round" opacity=".16">
      <path d="M0 250 H1600"/><path d="M0 560 H1600"/><path d="M300 0 V900"/><path d="M760 0 V900"/><path d="M1180 0 V900"/>
    </g>
    <g stroke="#ffffff" stroke-width="3" stroke-dasharray="20 26" opacity=".2">
      <path d="M0 250 H1600"/><path d="M0 560 H1600"/><path d="M300 0 V900"/><path d="M760 0 V900"/><path d="M1180 0 V900"/>
    </g>
    <g stroke="#ffffff" stroke-width="14" opacity=".06" stroke-linecap="round">
      <path d="M0 820 H1600"/><path d="M520 0 V900"/>
    </g>
  </g>

  <!-- route highlight -->
  <path d="M360 220 C 520 220, 560 372, 640 372" fill="none" stroke="#ffd76a" stroke-width="5" stroke-dasharray="14 16" stroke-linecap="round" opacity=".7"/>

  <!-- pins -->
  <g>
    <ellipse cx="360" cy="470" rx="52" ry="14" fill="#12041a" opacity=".55"/>
    <g transform="translate(360 200)" filter="url(#pinShadow)">
      <path d="M0 0 C -52 0 -94 42 -94 94 C -94 168 0 260 0 260 C 0 260 94 168 94 94 C 94 42 52 0 0 0 Z" fill="url(#pinA)"/>
      <path d="M0 10 C -44 10 -80 44 -80 88 C -80 104 -72 124 -60 144 C -68 104 -44 68 0 62 Z" fill="#ffffff" opacity=".35"/>
      <circle cx="0" cy="92" r="36" fill="#2b0f24"/>
      <path d="M-15 92 l10 11 21 -24" fill="none" stroke="#ffe9a8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <g>
    <ellipse cx="1080" cy="522" rx="38" ry="11" fill="#12041a" opacity=".5"/>
    <g transform="translate(1080 330) scale(.72)" filter="url(#pinShadow)">
      <path d="M0 0 C -52 0 -94 42 -94 94 C -94 168 0 260 0 260 C 0 260 94 168 94 94 C 94 42 52 0 0 0 Z" fill="url(#pinB)"/>
      <path d="M0 10 C -44 10 -80 44 -80 88 C -80 104 -72 124 -60 144 C -68 104 -44 68 0 62 Z" fill="#ffffff" opacity=".3"/>
      <circle cx="0" cy="92" r="36" fill="#2b0f24"/>
      <circle cx="0" cy="92" r="14" fill="#ffc0e6"/>
    </g>
  </g>
  <g>
    <ellipse cx="560" cy="536" rx="32" ry="10" fill="#12041a" opacity=".45"/>
    <g transform="translate(560 372) scale(.62)" filter="url(#pinShadow)">
      <path d="M0 0 C -52 0 -94 42 -94 94 C -94 168 0 260 0 260 C 0 260 94 168 94 94 C 94 42 52 0 0 0 Z" fill="url(#pinC)"/>
      <path d="M0 10 C -44 10 -80 44 -80 88 C -80 104 -72 124 -60 144 C -68 104 -44 68 0 62 Z" fill="#ffffff" opacity=".35"/>
      <circle cx="0" cy="92" r="36" fill="#0d2233"/>
      <circle cx="0" cy="92" r="14" fill="#c9f0ff"/>
    </g>
  </g>

  <!-- provider / booking card -->
  <g filter="url(#drop)">
    <rect x="880" y="516" rx="28" width="600" height="308" fill="url(#panel)" stroke="url(#edge)" stroke-width="2"/>
    <rect x="880" y="516" rx="28" width="600" height="70" fill="#ff8ad2" opacity=".1"/>
    <circle cx="958" cy="600" r="44" fill="url(#avatar)"/>
    <path d="M958 588 a17 17 0 1 1 .1 0 M928 638 a31 23 0 0 1 60 0" fill="#2a0f33" opacity=".75"/>
    <circle cx="988" cy="628" r="15" fill="#4ade80"/>
    <path d="M981 628 l5 6 10 -12" fill="none" stroke="#0d2b16" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1026" y="576" rx="9" width="230" height="20" fill="#ffffff" opacity=".9"/>
    <rect x="1026" y="612" rx="9" width="150" height="17" fill="#ffb3e4" opacity=".6"/>
    <rect x="1290" y="572" rx="14" width="150" height="42" fill="#ffffff" opacity=".08" stroke="#ffb3e4" stroke-width="1.5"/>
    <rect x="1312" y="586" rx="7" width="106" height="14" fill="#ffb3e4" opacity=".65"/>
    <g fill="#ffd76a" transform="translate(926 686)">
      <path d="M22 0 l7 15 16 2 -12 12 3 17 -14 -8 -14 8 3 -17 -12 -12 16 -2 Z"/>
      <path transform="translate(62 0)" d="M22 0 l7 15 16 2 -12 12 3 17 -14 -8 -14 8 3 -17 -12 -12 16 -2 Z"/>
      <path transform="translate(124 0)" d="M22 0 l7 15 16 2 -12 12 3 17 -14 -8 -14 8 3 -17 -12 -12 16 -2 Z"/>
      <path transform="translate(186 0)" d="M22 0 l7 15 16 2 -12 12 3 17 -14 -8 -14 8 3 -17 -12 -12 16 -2 Z"/>
      <path transform="translate(248 0)" opacity=".3" d="M22 0 l7 15 16 2 -12 12 3 17 -14 -8 -14 8 3 -17 -12 -12 16 -2 Z"/>
    </g>
    <rect x="1244" y="690" rx="9" width="180" height="16" fill="#ffffff" opacity=".22"/>
    <rect x="926" y="752" rx="16" width="230" height="50" fill="url(#cta)" filter="url(#bloom)"/>
    <rect x="1180" y="752" rx="16" width="230" height="50" fill="#ffffff" opacity=".1" stroke="#ffb3e4" stroke-width="1.5"/>
  </g>

  <!-- search pill -->
  <g filter="url(#drop)">
    <rect x="110" y="696" rx="36" width="580" height="72" fill="#ffffff" opacity=".96"/>
    <g stroke="#3a1140" stroke-width="7" fill="none" opacity=".8"><circle cx="176" cy="732" r="18"/><path d="M189 745 L208 764" stroke-linecap="round"/></g>
    <rect x="242" y="722" rx="10" width="248" height="20" fill="#3a1140" opacity=".38"/>
    <rect x="536" y="708" rx="18" width="128" height="48" fill="url(#cta)"/>
  </g>

  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
