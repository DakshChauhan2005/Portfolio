<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Terminal agent loop choosing between a web search tool and an email tool">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04070a"/><stop offset=".55" stop-color="#0a1a16"/><stop offset="1" stop-color="#12362c"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".62" cy=".5" r=".45">
      <stop offset="0" stop-color="#4ade80" stop-opacity=".26"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".12" cy=".22" r=".45">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".18"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".78">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".62"/>
    </radialGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071310" stop-opacity=".99"/><stop offset="1" stop-color="#030907" stop-opacity=".99"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86efac" stop-opacity=".6"/><stop offset="1" stop-color="#4ade80" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80" stop-opacity=".15"/><stop offset="1" stop-color="#86efac" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="core" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#0f3327"/><stop offset="1" stop-color="#05130e"/>
    </radialGradient>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="3" fill="#4ade80" opacity=".035"/>
    </pattern>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#010604" flood-opacity=".75"/>
    </filter>
    <filter id="bloom" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#glowA)"/>
  <rect width="1600" height="900" fill="url(#glowB)"/>

  <!-- terminal -->
  <g filter="url(#drop)">
    <rect x="100" y="140" rx="22" width="740" height="620" fill="url(#term)" stroke="url(#edge)" stroke-width="2"/>
    <rect x="100" y="140" rx="22" width="740" height="62" fill="#4ade80" opacity=".1"/>
    <g><circle cx="142" cy="171" r="10" fill="#ff5f57"/><circle cx="176" cy="171" r="10" fill="#febc2e"/><circle cx="210" cy="171" r="10" fill="#28c840"/></g>
    <rect x="256" y="163" rx="7" width="180" height="16" fill="#86efac" opacity=".35"/>
    <rect x="100" y="202" width="740" height="558" fill="url(#scan)"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27">
      <text x="140" y="278" fill="#4ade80">$ <tspan fill="#e6f5ee">fetch-n-send</tspan> <tspan fill="#5f7d72">--chat</tspan></text>
      <text x="140" y="340" fill="#7dd3fc">&gt; latest news on mistral ai</text>
      <text x="140" y="470" fill="#e6f5ee" opacity=".85">searching, then mailing you the</text>
      <text x="140" y="508" fill="#e6f5ee" opacity=".85">summary…</text>
      <text x="140" y="596" fill="#86efac">agent: <tspan fill="#e6f5ee" opacity=".7">done — 1 mail sent</tspan></text>
      <text x="140" y="672" fill="#4ade80">$</text>
    </g>
    <g>
      <rect x="140" y="382" rx="13" width="212" height="42" fill="#facc15" opacity=".13" stroke="#facc15" stroke-width="1.5"/>
      <circle cx="166" cy="403" r="7" fill="#facc15"/>
      <text x="184" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" fill="#ffe082">web_search</text>
      <rect x="372" y="382" rx="13" width="196" height="42" fill="#facc15" opacity=".13" stroke="#facc15" stroke-width="1.5"/>
      <circle cx="398" cy="403" r="7" fill="#facc15"/>
      <text x="416" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" fill="#ffe082">send_mail</text>
    </g>
    <rect x="176" y="648" width="17" height="32" fill="#4ade80" filter="url(#bloom)"/>
  </g>

  <!-- agent core -->
  <g>
    <circle cx="1016" cy="450" r="132" fill="none" stroke="#4ade80" stroke-width="1.5" opacity=".14" stroke-dasharray="5 13"/>
    <circle cx="1016" cy="450" r="108" fill="none" stroke="#4ade80" stroke-width="1.5" opacity=".26"/>
    <circle cx="1016" cy="450" r="82" fill="url(#core)" stroke="#4ade80" stroke-width="3" filter="url(#bloom)"/>
    <g fill="none" stroke="#86efac" stroke-width="5" stroke-linecap="round">
      <rect x="982" y="424" width="68" height="52" rx="16"/>
      <path d="M1016 424 v-22 M1016 396 a7 7 0 1 1 .1 0"/>
      <path d="M982 444 h-16 M1050 444 h16"/>
    </g>
    <g fill="#4ade80"><circle cx="1000" cy="448" r="7"/><circle cx="1032" cy="448" r="7"/></g>
    <path d="M1002 462 h28" stroke="#4ade80" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- wires -->
  <g fill="none" stroke="url(#wire)" stroke-width="4" stroke-linecap="round">
    <path d="M840 450 L926 450"/>
    <path d="M1104 450 C 1180 450, 1180 262, 1258 262"/>
    <path d="M1104 450 C 1180 450, 1180 638, 1258 638"/>
  </g>
  <g fill="#b7ffcf">
    <circle cx="884" cy="450" r="5" opacity=".9"/>
    <circle cx="1176" cy="344" r="5" opacity=".85"/>
    <circle cx="1176" cy="556" r="5" opacity=".85"/>
  </g>

  <!-- search tool -->
  <g filter="url(#drop)">
    <rect x="1258" y="172" rx="22" width="252" height="180" fill="url(#term)" stroke="#7dd3fc" stroke-width="2" opacity=".97"/>
    <rect x="1258" y="172" rx="22" width="252" height="48" fill="#7dd3fc" opacity=".12"/>
    <rect x="1286" y="188" rx="6" width="92" height="15" fill="#bde8ff" opacity=".5"/>
    <g stroke="#7dd3fc" stroke-width="9" fill="none" stroke-linecap="round" filter="url(#bloom)">
      <circle cx="1362" cy="278" r="36"/><path d="M1388 304 L1418 334"/>
    </g>
  </g>

  <!-- mail tool -->
  <g filter="url(#drop)">
    <rect x="1258" y="548" rx="22" width="252" height="180" fill="url(#term)" stroke="#facc15" stroke-width="2" opacity=".97"/>
    <rect x="1258" y="548" rx="22" width="252" height="48" fill="#facc15" opacity=".12"/>
    <rect x="1286" y="564" rx="6" width="80" height="15" fill="#ffe082" opacity=".5"/>
    <g filter="url(#bloom)">
      <rect x="1306" y="622" width="156" height="102" rx="14" fill="none" stroke="#facc15" stroke-width="6"/>
      <path d="M1306 632 L1384 690 L1462 632" fill="none" stroke="#facc15" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
