<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Coffee cup with a priced menu and a locked admin dashboard">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b0f06"/><stop offset=".5" stop-color="#3d2210"/><stop offset="1" stop-color="#8a5426"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".28" cy=".3" r=".5">
      <stop offset="0" stop-color="#ffb974" stop-opacity=".3"/><stop offset="1" stop-color="#ffb974" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".85" cy=".85" r=".5">
      <stop offset="0" stop-color="#ff7a45" stop-opacity=".22"/><stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".78">
      <stop offset=".52" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7e2c6"/><stop offset=".2" stop-color="#ffffff"/><stop offset=".62" stop-color="#e8cfae"/><stop offset="1" stop-color="#b48f66"/>
    </linearGradient>
    <linearGradient id="crema" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9723c"/><stop offset=".5" stop-color="#6b3d17"/><stop offset="1" stop-color="#3d2110"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e1a0c" stop-opacity=".98"/><stop offset="1" stop-color="#170d05" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd7a8" stop-opacity=".6"/><stop offset="1" stop-color="#ffb974" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc978"/><stop offset="1" stop-color="#e0812f"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#0d0703" flood-opacity=".7"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="20" flood-color="#0d0703" flood-opacity=".55"/>
    </filter>
    <filter id="steamBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="bloom" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#glowA)"/>
  <rect width="1600" height="900" fill="url(#glowB)"/>
  <g opacity=".07" fill="none" stroke="#ffe6c9" stroke-width="2">
    <circle cx="190" cy="140" r="130"/><circle cx="190" cy="140" r="200"/><circle cx="1440" cy="820" r="180"/>
  </g>

  <!-- steam -->
  <g stroke="#ffeed8" stroke-width="11" stroke-linecap="round" fill="none" opacity=".4" filter="url(#steamBlur)">
    <path d="M296 268 c 34 -44 -34 -78 0 -122"/>
    <path d="M378 254 c 34 -54 -34 -90 0 -144"/>
    <path d="M460 268 c 34 -44 -34 -78 0 -122"/>
  </g>

  <!-- cup -->
  <g filter="url(#softShadow)">
    <path d="M556 372 h56 a86 86 0 0 1 0 172 h-30" fill="none" stroke="#e8cfae" stroke-width="20" stroke-linecap="round"/>
    <path d="M212 336 h336 v168 a168 168 0 0 1 -336 0 Z" fill="url(#cup)"/>
    <path d="M240 348 v150 a140 140 0 0 0 46 104 a168 168 0 0 1 -74 -142 V348 Z" fill="#ffffff" opacity=".45"/>
    <ellipse cx="380" cy="336" rx="168" ry="36" fill="#f3dcbd"/>
    <ellipse cx="380" cy="338" rx="150" ry="30" fill="url(#crema)"/>
    <ellipse cx="330" cy="326" rx="42" ry="12" fill="#c98d4f" opacity=".5"/>
  </g>
  <ellipse cx="380" cy="712" rx="228" ry="26" fill="#0d0703" opacity=".45"/>
  <rect x="176" y="700" width="408" height="24" rx="12" fill="#5a3a1c" opacity=".7"/>

  <!-- menu card -->
  <g filter="url(#drop)">
    <rect x="700" y="140" rx="26" width="392" height="620" fill="url(#panel)" stroke="url(#edge)" stroke-width="2"/>
    <rect x="700" y="140" rx="26" width="392" height="96" fill="#ffb974" opacity=".12"/>
    <rect x="748" y="176" rx="9" width="176" height="24" fill="#ffd7a8"/>
    <rect x="748" y="212" rx="7" width="104" height="12" fill="#ffd7a8" opacity=".45"/>
    <path d="M748 268 H1044" stroke="#ffd7a8" stroke-width="2" opacity=".25"/>
    <g>
      <g fill="#ffffff">
        <rect x="748" y="300" rx="8" width="180" height="16" opacity=".8"/>
        <rect x="748" y="326" rx="7" width="120" height="11" opacity=".3"/>
        <rect x="748" y="376" rx="8" width="212" height="16" opacity=".8"/>
        <rect x="748" y="402" rx="7" width="140" height="11" opacity=".3"/>
        <rect x="748" y="452" rx="8" width="152" height="16" opacity=".8"/>
        <rect x="748" y="478" rx="7" width="176" height="11" opacity=".3"/>
        <rect x="748" y="528" rx="8" width="196" height="16" opacity=".8"/>
        <rect x="748" y="554" rx="7" width="112" height="11" opacity=".3"/>
        <rect x="748" y="604" rx="8" width="168" height="16" opacity=".8"/>
        <rect x="748" y="630" rx="7" width="150" height="11" opacity=".3"/>
      </g>
      <g fill="#ffd76a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">
        <text x="1044" y="316" text-anchor="end">₹180</text>
        <text x="1044" y="392" text-anchor="end">₹240</text>
        <text x="1044" y="468" text-anchor="end">₹120</text>
        <text x="1044" y="544" text-anchor="end">₹320</text>
        <text x="1044" y="620" text-anchor="end">₹90</text>
      </g>
    </g>
    <rect x="748" y="686" rx="14" width="200" height="44" fill="url(#btn)"/>
  </g>

  <!-- admin dashboard -->
  <g filter="url(#drop)">
    <rect x="1140" y="216" rx="24" width="380" height="470" fill="url(#panel)" stroke="url(#edge)" stroke-width="2"/>
    <rect x="1140" y="216" rx="24" width="380" height="66" fill="#ffffff" opacity=".08"/>
    <g fill="#ffd7a8" opacity=".5"><circle cx="1178" cy="249" r="8"/><circle cx="1206" cy="249" r="8"/><circle cx="1234" cy="249" r="8"/></g>
    <rect x="1262" y="241" rx="7" width="112" height="16" fill="#ffd7a8" opacity=".35"/>
    <g transform="translate(1466 232)" filter="url(#bloom)">
      <rect x="-20" y="6" width="40" height="32" rx="9" fill="#ffd76a"/>
      <path d="M-12 6 v-11 a12 12 0 0 1 24 0 v11" fill="none" stroke="#ffd76a" stroke-width="6"/>
    </g>
    <g>
      <rect x="1180" y="320" rx="12" width="300" height="60" fill="#ffffff" opacity=".07"/>
      <rect x="1180" y="392" rx="12" width="300" height="60" fill="#ffffff" opacity=".07"/>
      <rect x="1180" y="464" rx="12" width="300" height="60" fill="#ffffff" opacity=".07"/>
      <g fill="#ffd7a8">
        <rect x="1202" y="338" rx="7" width="140" height="14" opacity=".85"/>
        <rect x="1202" y="360" rx="6" width="88" height="10" opacity=".35"/>
        <rect x="1202" y="410" rx="7" width="112" height="14" opacity=".85"/>
        <rect x="1202" y="432" rx="6" width="120" height="10" opacity=".35"/>
        <rect x="1202" y="482" rx="7" width="160" height="14" opacity=".85"/>
        <rect x="1202" y="504" rx="6" width="76" height="10" opacity=".35"/>
      </g>
      <g>
        <rect x="1386" y="338" rx="14" width="62" height="28" fill="#4ade80" opacity=".9"/><circle cx="1434" cy="352" r="11" fill="#0d1f10"/>
        <rect x="1386" y="410" rx="14" width="62" height="28" fill="#4ade80" opacity=".9"/><circle cx="1434" cy="424" r="11" fill="#0d1f10"/>
        <rect x="1386" y="482" rx="14" width="62" height="28" fill="#ffffff" opacity=".18"/><circle cx="1400" cy="496" r="11" fill="#ffd7a8" opacity=".7"/>
      </g>
    </g>
    <rect x="1180" y="574" rx="14" width="150" height="46" fill="url(#btn)"/>
    <rect x="1348" y="574" rx="14" width="132" height="46" fill="#ffffff" opacity=".08" stroke="#ffd7a8" stroke-width="1.5"/>
  </g>

  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
